# Sound-effect kinds: what each is for, and the Freesound search that finds more.
# The library is assets/sfx/<kind>-<n>.*; /produce-video picks from it by `use`.
# scripts/fetch_sfx.py downloads new CC0 matches to assets/sfx/new/ for review, skipping every
# Freesound ID already in assets/sfx/SOURCES.md. Every kind is named for the sound itself:
# Freesound's CC0 library has no real branded or meme sounds (Apple Pay, vine boom...), and
# soundalikes filed under those names don't sound like them. Add a recognisable one by hand;
# the real thing is copyrighted, and Instagram's audio matching can flag it.
# max_s: longest file accepted (default 6). skip: extra Freesound IDs never to fetch.

- {name: bruh, query: bruh, use: deadpan disbelief at something dumb}
- {name: sad-violin, query: sad violin, use: mock sympathy; a loss}
- {name: error, query: error beep, use: something breaks; a bug}
- {name: metal-pipe, query: metal pipe falling, use: something breaks; absurd sudden fail}
- {name: air-horn, query: air horn, use: hype; a big win}
- {name: wasted, query: game over, use: total failure}
- {name: oof, query: oof, use: minor ouch}
- {name: boo-womp, query: sad trombone, use: letdown; anticlimax}
- {name: dun-dun-duun, query: dun dun dun dramatic, use: dramatic reveal, skip: [411232]}
- {name: rimshot, query: rimshot, use: right after a joke}
- {name: anime-wow, query: anime wow, use: amazed}
- {name: crickets, query: crickets, use: awkward silence; nobody cares}
- {name: fart-reverb, query: fart reverb, use: lowbrow gag; rarely}
- {name: bong, query: bong chime, use: abrupt punchline hit}
- {name: notification-ding, query: notification ding, use: a notification or message}
- {name: ping, query: notification ping, use: chat or app ping}
- {name: keyboard-typing, query: keyboard typing, use: coding; writing}
- {name: typing-key, query: keyboard key press, use: one keystroke; the typed title's letters, max_s: 0.4}
- {name: typewriter-key, query: typewriter key, use: one typewriter keystroke; a typed title, max_s: 0.5}
- {name: correct-ding, query: correct answer, use: right answer; it works}
- {name: wrong-buzzer, query: wrong answer buzzer, use: wrong; it fails}
- {name: cash-register, query: cash register, use: money; a price}
- {name: camera-shutter, query: camera shutter, use: a screenshot or photo}
- {name: bubble-pop, query: bubble pop, use: light, playful accent}
- {name: whoosh, query: whoosh, use: transition; motion}
- {name: message-send, query: message sent, use: sending a message}
- {name: success-chime, query: success chime, use: a payment or task going through}
- {name: record-scratch, query: record scratch, use: "hold up — stop, wait, what?"}
- {name: bass-drop, query: bass drop boom, use: a big moment}
- {name: riser, query: riser, use: build-up; ends on the claim it leads into}
- {name: sparkle, query: sparkle, use: something new, shiny or magic}
- {name: page-turn, query: page turn, use: next point; docs}
- {name: pen-writing, query: pen writing, use: notes; signing}
- {name: marker-stroke, query: scribble, use: a word written or underlined; the ink title, max_s: 1.5}
- {name: tape-rip, query: tape rip, use: tearing something off; a reveal}
- {name: clock-ticking, query: clock ticking, use: time pressure; waiting, max_s: 10}
- {name: heartbeat, query: heartbeat, use: tension, max_s: 10}
- {name: rain-ambience, query: rain ambience, use: gloomy mood, max_s: 10}
- {name: glass-clink, query: glass clink, use: cheers; celebrating}
- {name: cinematic-impact, query: cinematic impact hit, use: a title or dramatic reveal}


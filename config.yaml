input:
  footage: ./input/
  # script: ./script.txt           # optional — provide for outtake removal; omit for silence-cut-only mode
  # clips_folder: ./clips/         # optional, for multi-clip

cuts:
  # --- What gets cut ---
  min_silence_ms: 200              # gaps longer than this are cut. Raise to preserve more natural pauses;
                                   # lower to cut more aggressively.
  min_breath_ms: 100               # breath sounds longer than this are cut. Raise to keep more breaths
                                   # (more natural); lower to remove even short breaths.
  breath_detection: true           # set false to treat all non-silent gaps as noise (faster, less precise)
  silence_threshold_db: -45        # noise floor for silence detection. Raise (e.g. -40) if background noise
                                   # is causing over-cutting; lower (e.g. -50) if silences aren't being detected.

  # --- Word boundary precision ---
  speech_pad_ms: 150               # ms of audio kept before each word's start timestamp on a cut.
                                   # WhisperX start timestamps run 80-150ms late — this pad stops the
                                   # beginning of words getting clipped. Raise if sentence starts sound
                                   # cut off; lower if you hear too much silence before words.
  word_end_scan_ms: 50             # how far (ms) to scan backward from a word's end timestamp to find
                                   # the true silence onset. Stops sentence endings getting clipped by
                                   # stop consonants ("t","p","k") that look like silence at wider windows.
                                   # Raise if trailing silence is being left in; lower if word ends are clipped.

  # --- Advanced ---
  vad_threshold: 0.5               # Silero VAD sensitivity for hallucination filtering (0-1). Lower = more
                                   # words kept; higher = more hallucinated words dropped.
  breath_amplitude_ratio: 0.15     # breath RMS must be below this fraction of track peak amplitude.
                                   # Prevents loud noise bursts being misclassified as breaths.
  failure_tolerance_ratio: 0.02    # fraction of samples allowed to spike above noise floor before a gap
                                   # is considered non-silent. Prevents single transients fragmenting cuts.
  min_keep_ms: 200                 # drop kept segments shorter than this after cutting. Prevents isolated
                                   # sub-word fragments ("a", "I") becoming their own clip.
  min_retake_words: 0              # duplicate-take detection: min words in a repeated phrase to trigger a
                                   # retake cut. 0 = disabled.
  min_word_confidence: 0.5         # hard floor: if either adjacent word's alignment confidence is below
                                   # this, the gap is never cut regardless of duration.
  low_confidence_threshold: 0.8    # soft threshold: if either adjacent word is below this (but above
                                   # min_word_confidence), the gap must meet low_confidence_min_gap_ms
                                   # to qualify for a cut.
  low_confidence_min_gap_ms: 100   # minimum gap duration (ms) required to cut when adjacent word
                                   # confidence is between min_word_confidence and low_confidence_threshold.
  preserve_start_s: 0.0            # seconds from the start of the clip where no cuts will be made.
                                   # Set e.g. 2.0 to leave the first 2 seconds untouched — useful when
                                   # the opening line has uncertain alignment or you want a clean intro.


output:
  format: "9:16"
  resolution: [1080, 1920]
  fps: 30
  codec: h264
  audio_bitrate: 128k
  max_duration_s: 90
  location: ./output/

captions:
  enabled: true
  style: word_highlight            # word_highlight | full_line | none
  font: HelveticaNeue
  size: 48
  color: "#FFFFFF"
  highlight_color: "#FFD700"
  position: center                 # top | center | bottom
  stroke: false
  stroke_color: "#000000"
  stroke_width: 3
  margin_pct: 15                    # % of video width kept free on each side — increase to pull captions inward

images:
  enabled: true
  auto_detect: true              # scan all transcript words against gilbarbara/logos shortnames
  require_capitalized: true      # only match words Whisper capitalised — Whisper capitalises proper nouns
                                 # so this naturally filters out common English words (box, base, arc, etc.)
                                 # set false to match all words, or add lowercase brands to keywords instead
  keywords: []                   # logo slugs to always match regardless of capitalisation (e.g. [python])
  exclude: []                    # logo slugs to never match (last-resort override)
  position: center                  # top | center | bottom  (top keeps logos clear of center captions)
  size_pct: 50                   # logo width as % of video width
  display_duration_s: 2.0        # seconds to show logo after its keyword is first spoken
  fade_duration_s: 0            # fade in and out duration in seconds (0 to disable)
  

whisper:
  model: large-v2
  compute_type: int8               # int8 (CPU) | float16 (GPU)
  language: en
  beam_size: 4                     # 1 = greedy/fastest but error-prone; 5 = beam search, considers multiple
                                   # candidates before committing to a word — significantly reduces errors
                                   # on numbers, proper nouns, and ambiguous phrases. 2-3x slower than 1.
  initial_prompt: "Software engineering, AI, 6 months, 12 months, years of experience, developer, product"
                                   # primes Whisper toward expected vocabulary — significantly improves
                                   # accuracy on numbers and domain terms. Update to match your content.
  condition_on_previous_text: false # false = each Whisper segment is decoded independently, preventing a
                                   # missed/hallucinated segment from derailing the rest of the transcript.
                                   # true = segments share context, slightly more fluent but hallucinations
                                   # can cascade across segment boundaries.
  min_alignment_confidence: 0.1   # WhisperX wav2vec2 alignment score below which a word is dropped.
                                   # Scores near 0 (e.g. 0.03) mean wav2vec2 could not locate the word in
                                   # the audio — a strong signal the word was hallucinated by Whisper.
                                   # Raise (e.g. 0.2) to be more aggressive; set 0.0 to disable.
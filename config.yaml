assets:
  location: ./assets               # working files per video (captions.json, debug.txt, screenshots, manifest)

cuts:
  # --- What gets cut ---
  min_silence_ms: 200              # gaps longer than this are cut (main pipeline). Also the minimum
                                   # silence duration used to split retranscription windows into sub-clips.
                                   # Raise to preserve more natural pauses; lower to cut more aggressively.
  min_breath_ms: 100               # breath sounds longer than this are cut. Raise to keep more breaths
                                   # (more natural); lower to remove even short breaths.
  breath_detection: true           # set false to treat all non-silent gaps as noise (faster, less precise)
  silence_threshold_db: -45        # noise floor for silence detection. Used by main gap detector and by
                                   # retranscription window splitting. Raise (e.g. -40) if background noise
                                   # is causing over-cutting; lower (e.g. -50) if silences aren't being detected.

  # --- Word boundary precision ---
  speech_pad_ms: 150               # ms of audio kept before each word's start timestamp on a cut.
                                   # WhisperX start timestamps run 80-150ms late — this pad stops the
                                   # beginning of words getting clipped. Raise if sentence starts sound
                                   # cut off; lower if you hear too much silence before words.
  word_end_scan_ms: 10             # how far (ms) to scan backward from a word's end timestamp to find
                                   # the true silence onset. Stops sentence endings getting clipped by
                                   # stop consonants ("t","p","k") that look like silence at wider windows.
                                   # Raise if trailing silence is being left in; lower if word ends are clipped.

  # --- Advanced ---
  vad_threshold: 0.4              # Silero VAD sensitivity for hallucination filtering (0-1). Lower = more
                                   # words kept; higher = more hallucinated words dropped.
  breath_amplitude_ratio: 0.15     # breath RMS must be below this fraction of track peak amplitude.
                                   # Prevents loud noise bursts being misclassified as breaths.
  failure_tolerance_ratio: 0.02    # fraction of samples allowed to spike above noise floor before a gap
                                   # is considered non-silent. Used by both main gap detector and retranscription
                                   # window splitting. Prevents single transients fragmenting cuts.
  min_keep_ms: 200                 # drop kept segments shorter than this after cutting. Prevents isolated
                                   # sub-word fragments ("a", "I") becoming their own clip.
  mid_sentence_cut_floor_ms: 1000  # gaps below this duration (ms) are never cut unless the preceding word
                                   # ends with sentence-ending punctuation (. ! ? , ; :). Prevents jump
                                   # cuts landing mid-phrase from restarts or pauses mid-delivery.
  sentence_pause_s: 0.6            # sentence-boundary recovery when Whisper drops a full stop: a capitalised
                                   # next word preceded by a pause >= this (seconds) counts as a sentence end.
                                   # Drives caption line breaks and EDL cut permission. Lower = more boundaries
                                   # (risk false splits at mid-sentence proper nouns); higher = fewer. See the
                                   # .debug.1b.sentences.txt report (VIA=caps+pause column) to tune.
  repetition_detection: true       # detect and cut repeated takes (earlier occurrence cut, last take kept)
  min_retake_words: 3              # default: 4 | minimum consecutive words to qualify as a repeated take
  max_retake_gap_s: 12             # default: 20 | max seconds of silence BETWEEN consecutive takes to count
                                   # as a false start. Prevents common short phrases far apart in the video
                                   # from being misidentified as retakes. Bounds the inter-take gap only —
                                   # NOT the take's own length (see max_retake_span_s).
  max_retake_span_s: 60            # default: 60 | max duration of a single retake cut (the failed take's own
                                   # length). Safety net against runaway merges; raise if long sentences are
                                   # re-recorded and the whole failed take should be cut.
  min_match_ratio: 0.5             # default: 0.5 | greedy extended match length / cut length must meet this
                                   # threshold. Prevents short coincidental phrase overlaps from triggering
                                   # large cuts. Raise (e.g. 0.7) to be stricter; lower (e.g. 0.3) to cut more.
  min_word_confidence: 0.35        # gap cut hard floor: if either adjacent word's alignment confidence
                                   # is below this, the gap is never cut regardless of duration.
  min_retrans_word_confidence: 0.10 # retranscription acceptance floor: words returned by a retranscription
                                   # window are dropped if their confidence is below this.
  retrans_rescue_floor: 0.05       # rescue floor: a retranscribed word below min_retrans_word_confidence
                                   # is kept if the original pass found the same word at or above this.
  low_confidence_threshold: 0.8    # soft threshold: if either adjacent word is below this (but above
                                   # min_word_confidence), the gap must meet low_confidence_min_gap_ms
                                   # to qualify for a cut.
  low_confidence_min_gap_ms: 100   # minimum gap duration (ms) required to cut when adjacent word
                                   # confidence is between min_word_confidence and low_confidence_threshold.
  preserve_start_s: 0.3            # seconds from the start of the clip where no cuts will be made.
                                   # Set e.g. 2.0 to leave the first 2 seconds untouched — useful when
                                   # the opening line has uncertain alignment or you want a clean intro.
  preserve_end_s: 0.3              # seconds from the end of the clip where no cuts will be made.
                                   # Set e.g. 1.0 to leave the final second untouched — useful when
                                   # the closing line has uncertain alignment or you want a clean outro.


output:
  format: "9:16"
  resolution: [1080, 1920]
  fps: 30
  codec: h264
  audio_bitrate: 128k
  # max_duration_s: 60
  location: ./output/
  render_workers: 8                 # number of parallel workers for frame rendering.
  zoom:                             # per-hook crop-zoom, seeded by output filename.
    enabled: true                   # EXPERIMENT ONLY — not a proven IG dedup lever (SSCD sees through it).
    min: 0.96                       # fraction of frame kept (0.96 = zoom in up to 4%)
    max: 1.0
  encode_variation:                 # per-hook encoder settings, seeded by output filename.
    enabled: true                   # Tier 0 hash hygiene: distinct bitstream per hook. Free, and
                                    # touches only the encoder — but beats naive hashing ONLY, not
                                    # SSCD or audio fingerprinting (see INSTAGRAM_DEDUP_EVASION_PLAN.md).
    crf_jitter: 1                   # libx264: +/- CRF steps around 23. Raise for more spread (visible above ~2).
    bitrate_jitter: 0.08            # videotoolbox: +/- fraction of the 8000k base bitrate
  flip:                             # horizontal mirror of the footage. Captions/title cards are
                                    # composited AFTER the flip, so on-screen text is never mirrored
                                    # — but anything physically in shot is (background text, logos
                                    # on clothing, which hand you gesture with).
    mode: "off"                     # off | alternate | all — which hooks get a flipped render.
                                    #   alternate = every second hook (3 hooks -> the middle one)
                                    # QUOTE "off" — bare off is a YAML boolean.
    apply: duplicate                # in_place | duplicate — a flipped render either REPLACES that
                                    #   hook's video (3 hooks -> 3 files) or is written ALONGSIDE it
                                    #   (3 hooks + mode:all -> 6 files).
    suffix: "-flipped"              # filename suffix for duplicate flipped outputs only
                                    # NOTE: not a proven IG dedup lever — SSCD is trained on flips
                                    # (INSTAGRAM_DEDUP_EVASION_PLAN.md #4). Cheap, but don't expect
                                    # a mirrored copy to de-cluster from its original.

audio:
  enabled: true
  default: chill-draw-interest      # track name mixed under EVERY video, full-length, unless
                                    # overridden in assets/<slug>/audio.json. "" = no music.
                                    # Tracks are auto-discovered from assets/audio/ (untracked by
                                    # git) — the name is the file's stem, e.g. "upbeat" for
                                    # assets/audio/upbeat.mp3. Just drop files in; nothing to list.
  ducking_lufs: 13                  # music is auto-leveled to sit this many LUFS below the measured
                                    # voice loudness (so the source file's level doesn't matter).
                                    # Higher = quieter music. Per-track gain_db trims on top.
  tracks:                           # optional per-track tuning, keyed by track name. Add an entry
                                    # only to set a start time, volume trim, or slow-down.
    chill-draw-interest:
      source_start: 3.5             # begin X seconds into the file
      slow_pct: 10                  # slow the track by 10% (pitch drops with it). 0 = original
                                    # speed; max ~50.

captions:
  enabled: true
  style: full_line                 # word_highlight | full_line | none
                                   # full_line: every word one color. word_highlight: active (spoken) word
                                   # drawn in highlight_color. Set word_highlight to enable per-word highlighting.
  font: Inter                      # bundled in reelcut/fonts/ (bold grotesque, CapCut/Reels look)
  size: 50
  color: "#FFFFFF"
  highlight_color: "#FFD700"       # color of the active word — only used when style: word_highlight
  position: center                 # top | center | bottom
  stroke: true                     # draw an outline around text (improves legibility on bright footage)
  stroke_color: "#000000"
  stroke_width: 8                  # thick black outline — the defining feature of the pro caption look
  shadow: true                     # soft blurred drop shadow behind text (adds depth)
  shadow_color: "#000000"
  shadow_offset: 5                 # vertical drop of the soft shadow in px
  shadow_blur: 8                   # gaussian blur radius of the soft shadow in px
  shadow_opacity: 0.5              # 0-1 opacity of the soft shadow
  margin_pct: 8                     # % of video width kept free on each side — increase to pull captions inward
  words_per_line: 5                 # max words shown on screen at once (default: 7)
  line_spacing: 10                 # px between wrapped rows
  grace_s: 0.6                     # seconds a caption line stays visible after its last word ends

images:
  enabled: true
  auto_detect: true              # scan all transcript words against gilbarbara/logos shortnames
  require_capitalized: true      # only match words Whisper capitalised — Whisper capitalises proper nouns
                                 # so this naturally filters out common English words (box, base, arc, etc.)
                                 # set false to match all words, or add lowercase brands to keywords instead
  keywords: []                   # logo slugs to always match regardless of capitalisation (e.g. [python])
  exclude: []                    # logo slugs to never match (last-resort override)
  # people and screenshots are specified in the .captions.json images array (filled in by LLM between phases)
  position: center               # top | center | bottom  (top keeps logos clear of center captions)
  logo_overlay_size_pct: 40      # logo width as % of video width
  overlay_size_pct: 50           # person/screenshot/concept width as % of video width
  figure_overlay_size_pct: 66    # figure (article chart/diagram) card width as % of video width
  display_duration_s: 1.0        # seconds to show logo after its keyword is first spoken
  fade_duration_s: 0             # fade in and out duration in seconds (0 to disable)
  margin_pct: 5                  # % of video height from the edge to the logo/image overlay.
  corner_drop_pct: 6             # extra % of video height to lower the displaced (corner) images when overlapping


# ---------------------------------------------------------------------------
# Headings — hand-authored title cards (assets/<slug>/headings.json)
# ---------------------------------------------------------------------------
headings:
  enabled: true                  # render headings if a headings.json is present next to the captions file
  default_end_s: -1             # default end time (output-timeline seconds) for the auto-created headings.json stub
  full_video: true               # render-hooks: keep the hook's title card up for the whole video
                                 # (hook + body). false = only for the hook, then it disappears.
  font: PlayfairDisplay          # bundled in reelcut/fonts/ (elegant gold serif look)
  subtitle_font: PlayfairDisplay-Italic
  title_size: 96                 # title point size at 1080-wide (auto-shrinks if it won't fit)
  subtitle_size: 46
  margin_pct: 8.0                # % of video width kept free on each side; title wraps/shrinks to fit
  color: "#F3C84E"               # warm gold
  subtitle_color: "#FFFFFF"
  position: upper-third          # top | upper-third | center
  shadow: true                   # soft blurred drop shadow for legibility
  shadow_blur: 10
  shadow_opacity: 0.55
  scrim: true                    # dark gradient behind text (override per-heading with "scrim": false)
  scrim_strength: 150            # max scrim darkness at the very top (0-255)


# ---------------------------------------------------------------------------
# Whisper / transcription
# ---------------------------------------------------------------------------
whisper:
  model: large-v2                  # default: medium
  compute_type: int8               # default: int8  |  int8 (CPU) | float16 (GPU)
  language: en                     # default: en
  beam_size: 4                     # default: 1  |  1 = greedy/fastest but error-prone; higher = beam search,
                                   # considers multiple candidates — reduces errors on numbers and proper nouns.
  initial_prompt: "Hello. Software engineering. AI for 12 months. Claude, GPT, the API, context window, 200k tokens"
                                   # default: null  |  primes Whisper toward expected vocabulary. Update to match content.
  condition_on_previous_text: false # default: false  |  true = segments share context (more fluent but
                                   # hallucinations can cascade); false = each segment decoded independently.
  min_alignment_confidence: 0.2   # default: 0.1  |  WhisperX wav2vec2 score below which a word falls back
                                   # to its original Whisper timestamp instead of the aligned one.
                                   # Low-conf words are no longer dropped here; they pass through and
                                   # are caught by Case 4 retranscription (trigger=low_conf_word).
  no_speech_threshold: 0.6        # default: 0.6  |  faster-whisper threshold for skipping silent segments.
                                   # Lower to force transcription of uncertain segments.
  retranscribe_no_speech_threshold: 0.3  # default: 0.3  |  used when re-running Whisper on wide-word windows
                                   # to surface false starts hidden in large aligned spans.
  wide_word_threshold_s: 1.0      # default: 1.5  |  word span (seconds) above which a word triggers
                                   # retranscription. Lower (e.g. 1.0) to catch more false starts.
  retranscribe_low_conf_gap_ms: 500   # default: 1000 | gap (ms) after a run of low-confidence words
                                   # that triggers retranscription of that region. Uses min_word_confidence
                                   # as the confidence floor. Set 0 to disable.
  retranscribe_merge_gap_s: 1.0    # default: 1.0  | max gap (s) between adjacent retranscription windows
                                   # that will be bridged into a single Whisper pass. Prevents windows
                                   # triggered by different events across a noise/retake boundary from
                                   # running in isolation and losing cross-boundary context.
  retranscribe_large_gap_ms: 1500  # default: 1500 | gap (ms) between any two consecutive words that
                                   # triggers retranscription regardless of confidence. Catches false
                                   # starts Whisper absorbed without surfacing twice. Set 0 to disable.
  retranscribe_low_conf_gap_floor_ms: 350  # default: 350 | when a low-confidence word is preceded by a
                                   # gap at least this large, its retranscription window extends back
                                   # across the gap. Catches speech Whisper dropped into the gap (mangling
                                   # the boundary word) even when the gap is below the large-gap floor.
  compression_ratio_threshold: null # default: 2.4 | gzip compression ratio above which a segment is
                                   # discarded as a hallucination loop. Raise (e.g. 3.0) to tolerate
                                   # repeated phrases; set null to disable entirely.
  retranscribe_compression_ratio_threshold: 4 # default: 2.4 | stricter threshold used during retranscription
                                   # windows — short clips are more susceptible to hallucination loops
                                   # so a tighter limit than the initial pass is appropriate.

# ─── Keyword Configuration ────────────────────────────────────────────────────
#
# Scoring: strong keyword = 3pts, weak keyword in title = 2pts / in excerpt = 1pt,
# title_keyword (title only) = 3pts. Needs >= min_relevance_score to pass.

strong_keywords:

title_keywords:


weak_keywords:

# Exclude articles whose title or excerpt contains any of these (case-insensitive)
excluded_keywords:
  - "introducing "
  - "gpt-4"
  - "gpt 4"
  - "dall-e"
  - "stable diffusion"
  - "midjourney"
  - "introducing our"
  - "we're excited to announce"
  - "we are excited to announce"
  - "announcing "
  - "launches "
  - "launch of"
  - "releasing "
  - "release of"
  - "now generally available"
  - "now available"
  - "product update"
  - "software update"
  - "free tier"
  - "get started with"
  - "hiring"
  - "we're hiring"
  - "career"
  - "job opening"
  - "apply now"
  - "is here"
  # Internal tooling / ops — low video potential
  - backup catalog
  - process metrics
  - key suite
  - observability pipeline

# Exclude articles whose URL path contains any of these
excluded_url_patterns:
  - /careers/
  - /jobs/
  - /press/
  - /announcement/
  - /policy/
  - /safety/

# Relevance threshold — articles below this score are excluded
min_relevance_score: 0

# Rolling retention — articles older than this many days are pruned from the db on each merge
db_retention_days: 200

# Only consider articles published within this many days
lookback_days: 200
